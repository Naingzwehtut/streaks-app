name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create --project-name streaks --org dev.streaks .
          fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
